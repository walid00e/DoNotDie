- name: "configure golder image"
  hosts: localhost
  become: true
  tasks:
    - name: "update apt cache"
      ansible.builtin.apt:
        update_cache: true

    - name: "install nginx"
      ansible.builtin.apt:
        name: nginx
        state: present

    - name: "Create custom index.html"
      copy:
        content: "<h1>GCP Golden Image - Baked by Packer & Ansible</h1>"
        dest: /var/www/html/index.html

    - name: "Ensure Nginx is started"
      ansible.builtin.service:
        name: nginx
        state: started